<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor — DOGWALKPOOPOO Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    /* ── ADMIN LAYOUT ── */
    .admin-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    .admin-sidebar {
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      padding: 2rem 0;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 220px;
      display: flex;
      flex-direction: column;
    }

    .sidebar-logo {
      padding: 1rem 1.5rem 2rem;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .sidebar-logo span { color: var(--accent); }

    .sidebar-section {
      padding: 0.5rem 1.5rem;
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 1rem;
      margin-bottom: 0.25rem;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.5rem;
      font-size: 0.82rem;
      color: var(--text-secondary);
      transition: color 0.2s, background 0.2s;
      cursor: pointer;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      text-decoration: none;
    }

    .sidebar-link:hover { color: var(--text-primary); background: var(--bg-3); }
    .sidebar-link.active { color: var(--accent); }

    .sidebar-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .user-badge {
      font-size: 0.72rem;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .user-role {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 0.25rem;
    }

    .logout-btn {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }

    .logout-btn:hover { color: var(--text-secondary); }

    /* ── MAIN CONTENT ── */
    .admin-main {
      margin-left: 220px;
      padding: 2.5rem;
      min-height: 100vh;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .admin-title {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 400;
    }

    .btn {
      padding: 0.65rem 1.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background 0.2s, color 0.2s;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
    }

    .btn:hover { background: var(--accent); color: var(--bg); }
    .btn.btn-ghost { border-color: var(--border); color: var(--text-secondary); }
    .btn.btn-ghost:hover { border-color: var(--text-secondary); color: var(--text-primary); background: transparent; }
    .btn.btn-danger { border-color: #7A3030; color: #C07070; }
    .btn.btn-danger:hover { background: #7A3030; color: var(--text-primary); }

    /* ── POST TABLE ── */
    .post-table {
      width: 100%;
      border-collapse: collapse;
    }

    .post-table th {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .post-table td {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .post-table tr:hover td { background: var(--bg-2); }

    .post-title-cell {
      font-family: var(--font-serif);
      font-size: 1rem;
      color: var(--text-primary);
      margin-bottom: 0.2rem;
    }

    .post-source-cell {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid;
    }

    .status-draft    { color: var(--text-muted);   border-color: var(--border); }
    .status-pitched  { color: #8A9A6A;              border-color: #4A5A3A; }
    .status-revision { color: #B8874A;              border-color: #7A5030; }
    .status-published{ color: var(--accent);        border-color: var(--accent-dim); }
    .status-rejected { color: #C07070;              border-color: #7A3030; }

    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    /* ── HEAD NOTE ── */
    .head-note {
      margin-top: 0.5rem;
      padding: 0.6rem 0.8rem;
      background: var(--bg-3);
      border-left: 2px solid var(--accent-dim);
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* ── DRAWER / MODAL ── */
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: none;
      align-items: flex-start;
      justify-content: flex-end;
    }

    .drawer-overlay.open { display: flex; }

    .drawer {
      background: var(--bg-2);
      border-left: 1px solid var(--border);
      width: min(680px, 100vw);
      height: 100vh;
      overflow-y: auto;
      padding: 2.5rem;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .drawer-title {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 400;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.25rem;
      line-height: 1;
      transition: color 0.2s;
    }

    .close-btn:hover { color: var(--text-primary); }

    .form-group { margin-bottom: 1.5rem; }

    label {
      display: block;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    input, textarea, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus, select:focus { border-color: var(--accent-dim); }
    input::placeholder, textarea::placeholder { color: var(--text-muted); }
    textarea { resize: vertical; min-height: 100px; line-height: 1.7; }
    select option { background: var(--bg-2); }

    .form-hint {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      line-height: 1.6;
    }

    .drawer-footer {
      display: flex;
      gap: 0.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }

    /* ── EMPTY ── */
    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--text-muted);
    }

    .empty-state-title {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .empty-state-desc {
      font-size: 0.82rem;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    /* ── TABS ── */
    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .tab {
      padding: 0.75rem 1.25rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      transition: color 0.2s;
    }

    .tab:hover { color: var(--text-primary); }
    .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

    .tab-count {
      display: inline-block;
      background: var(--bg-3);
      padding: 0.1rem 0.4rem;
      border-radius: 2px;
      font-size: 0.6rem;
      margin-left: 0.35rem;
      color: var(--text-muted);
    }

    .tab.active .tab-count { background: rgba(196,168,130,0.15); color: var(--accent); }
  </style>
</head>
<body>
  <div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="sidebar-logo"><a href="../index.html" style="text-decoration:none;color:inherit;">UN<span>LIT</span></a></div>

      <div class="sidebar-section">Workspace</div>
      <button class="sidebar-link active" onclick="showTab('all')">
        <span class="sidebar-dot" style="background:var(--accent)"></span>
        내 포스트
      </button>
      <button class="sidebar-link" onclick="showTab('pitched')">
        <span class="sidebar-dot" style="background:#8A9A6A"></span>
        검토 요청됨
      </button>
      <button class="sidebar-link" onclick="showTab('revision')">
        <span class="sidebar-dot" style="background:#B8874A"></span>
        수정 요청됨
      </button>
      <button class="sidebar-link" onclick="showTab('published')">
        <span class="sidebar-dot" style="background:var(--accent-dim)"></span>
        발행됨
      </button>

      <div class="sidebar-section">Site</div>
      <a class="sidebar-link" href="../index.html" target="_blank">공개 사이트 ↗</a>
      <a class="sidebar-link" href="../team.html" target="_blank">팀 페이지 ↗</a>

      <div class="sidebar-footer">
        <div class="user-badge">
          <span class="user-role" id="sidebar-role">Editor</span>
          <span id="sidebar-name">—</span>
        </div>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
      <div class="admin-header">
        <h1 class="admin-title serif">내 포스트</h1>
        <button class="btn" onclick="openNewPost()">+ 새 포스트</button>
      </div>

      <div class="tab-bar" id="tab-bar">
        <button class="tab active" data-tab="all" onclick="switchTab('all', this)">
          전체 <span class="tab-count" id="count-all">0</span>
        </button>
        <button class="tab" data-tab="draft" onclick="switchTab('draft', this)">
          초안 <span class="tab-count" id="count-draft">0</span>
        </button>
        <button class="tab" data-tab="pitched" onclick="switchTab('pitched', this)">
          검토 요청 <span class="tab-count" id="count-pitched">0</span>
        </button>
        <button class="tab" data-tab="revision" onclick="switchTab('revision', this)">
          수정 요청 <span class="tab-count" id="count-revision">0</span>
        </button>
        <button class="tab" data-tab="published" onclick="switchTab('published', this)">
          발행 <span class="tab-count" id="count-published">0</span>
        </button>
      </div>

      <div id="posts-container">
        <!-- Rendered by JS -->
      </div>
    </main>
  </div>

  <!-- NEW / EDIT DRAWER -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawerOnOverlay(event)">
    <div class="drawer">
      <div class="drawer-header">
        <h2 class="drawer-title serif" id="drawer-title">새 포스트</h2>
        <button class="close-btn" onclick="closeDrawer()">✕</button>
      </div>

      <form id="post-form">
        <input type="hidden" id="post-id" />

        <div class="form-group">
          <label>제목 (한국어)</label>
          <input type="text" id="f-title" placeholder="발굴한 것의 이름" required />
        </div>
        <div class="form-group">
          <label>제목 (English)</label>
          <input type="text" id="f-title-en" placeholder="English title" />
        </div>
        <div class="form-group">
          <label>출처 / Source</label>
          <input type="text" id="f-source" placeholder="영화명, 작가명, 장소 등" required />
        </div>
        <div class="form-group">
          <label>설명 (한국어)</label>
          <textarea id="f-desc" placeholder="왜 이것이 아름다운지. 설명하기 어려워도 됩니다."></textarea>
        </div>
        <div class="form-group">
          <label>설명 (English)</label>
          <textarea id="f-desc-en" placeholder="English description"></textarea>
        </div>
        <div class="form-group">
          <label>태그 / Tags</label>
          <input type="text" id="f-tags" placeholder="film, movement, found (쉼표로 구분)" />
          <p class="form-hint">쉼표로 구분해서 입력하세요</p>
        </div>
        <div class="form-group">
          <label>링크 / Reference URL</label>
          <input type="text" id="f-link" placeholder="https://..." />
          <p class="form-hint">없어도 됩니다</p>
        </div>
        <div class="form-group">
          <label>피치 메모 (헤드 에디터에게)</label>
          <textarea id="f-pitch-note" placeholder="헤드 에디터에게 전달할 메모. 왜 지금 이것인지." style="min-height: 80px;"></textarea>
        </div>

        <div class="drawer-footer">
          <button type="button" class="btn btn-ghost" onclick="savePost('draft')">초안 저장</button>
          <button type="button" class="btn" onclick="savePost('pitched')">검토 요청 →</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script>
    let session = null;
    let allPosts = [];
    let currentTab = 'all';
    let editingId = null;

    async function init() {
      session = Store.Auth.requireSession('login.html');
      if (!session) return;
      if (session.role === 'head') {
        window.location.href = 'head.html';
        return;
      }

      document.getElementById('sidebar-name').textContent = session.name;
      document.getElementById('sidebar-role').textContent = session.category || 'Editor';

      await loadPosts();
    }

    async function loadPosts() {
      allPosts = await Store.Posts.getAll({ editorId: session.id });
      renderPosts();
      updateCounts();
    }

    function updateCounts() {
      const counts = { all: allPosts.length, draft: 0, pitched: 0, revision: 0, published: 0, rejected: 0 };
      allPosts.forEach(p => { if (counts[p.status] !== undefined) counts[p.status]++; });
      Object.keys(counts).forEach(k => {
        const el = document.getElementById(`count-${k}`);
        if (el) el.textContent = counts[k];
      });
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderPosts();
    }

    function renderPosts() {
      const container = document.getElementById('posts-container');
      const filtered = currentTab === 'all'
        ? allPosts
        : allPosts.filter(p => p.status === currentTab);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-title serif">아직 포스트가 없습니다</div>
            <p class="empty-state-desc">발굴한 아름다운 것을 새 포스트로 작성해보세요.</p>
            <button class="btn" onclick="openNewPost()">+ 새 포스트</button>
          </div>`;
        return;
      }

      container.innerHTML = `
        <table class="post-table">
          <thead>
            <tr>
              <th>포스트</th>
              <th>상태</th>
              <th>날짜</th>
              <th>액션</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(p => renderRow(p)).join('')}
          </tbody>
        </table>`;
    }

    function renderRow(p) {
      const actions = buildActions(p);
      const noteHtml = p.headNote
        ? `<div class="head-note">헤드 에디터: "${p.headNote}"</div>`
        : '';
      return `
        <tr>
          <td>
            <div class="post-title-cell">${p.title || '(제목 없음)'}</div>
            <div class="post-source-cell">${p.source || ''}</div>
            ${noteHtml}
          </td>
          <td><span class="status-badge status-${p.status}">${statusLabel(p.status)}</span></td>
          <td style="font-size:0.72rem;color:var(--text-muted);white-space:nowrap">${formatDate(p.createdAt)}</td>
          <td><div class="actions">${actions}</div></td>
        </tr>`;
    }

    function buildActions(p) {
      const btns = [];
      if (p.status === 'draft' || p.status === 'revision') {
        btns.push(`<button class="btn btn-ghost" onclick="openEdit('${p.id}')">편집</button>`);
        btns.push(`<button class="btn" onclick="pitchPost('${p.id}')">검토 요청 →</button>`);
      }
      if (p.status === 'pitched') {
        btns.push(`<button class="btn btn-ghost" style="font-size:0.65rem;padding:0.5rem 0.9rem" onclick="cancelPitch('${p.id}')">요청 취소</button>`);
      }
      btns.push(`<button class="btn btn-danger" onclick="deletePost('${p.id}')">삭제</button>`);
      return btns.join('');
    }

    function statusLabel(s) {
      return { draft:'초안', pitched:'검토 중', revision:'수정 요청', published:'발행됨', rejected:'반려됨' }[s] || s;
    }

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('ko-KR', { month:'short', day:'numeric' });
    }

    // ── DRAWER ──
    function openNewPost() {
      editingId = null;
      document.getElementById('drawer-title').textContent = '새 포스트';
      document.getElementById('post-form').reset();
      document.getElementById('post-id').value = '';
      document.getElementById('drawer-overlay').classList.add('open');
    }

    async function openEdit(id) {
      editingId = id;
      const post = await Store.Posts.getById(id);
      if (!post) return;
      document.getElementById('drawer-title').textContent = '포스트 편집';
      document.getElementById('post-id').value = id;
      document.getElementById('f-title').value = post.title || '';
      document.getElementById('f-title-en').value = post.titleEn || '';
      document.getElementById('f-source').value = post.source || '';
      document.getElementById('f-desc').value = post.description || '';
      document.getElementById('f-desc-en').value = post.descriptionEn || '';
      document.getElementById('f-tags').value = (post.tags || []).join(', ');
      document.getElementById('f-link').value = post.link || '';
      document.getElementById('f-pitch-note').value = post.pitchNote || '';
      document.getElementById('drawer-overlay').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer-overlay').classList.remove('open');
    }

    function closeDrawerOnOverlay(e) {
      if (e.target === document.getElementById('drawer-overlay')) closeDrawer();
    }

    async function savePost(targetStatus) {
      const id = document.getElementById('post-id').value;
      const data = {
        title: document.getElementById('f-title').value.trim(),
        titleEn: document.getElementById('f-title-en').value.trim(),
        source: document.getElementById('f-source').value.trim(),
        description: document.getElementById('f-desc').value.trim(),
        descriptionEn: document.getElementById('f-desc-en').value.trim(),
        tags: document.getElementById('f-tags').value.split(',').map(t => t.trim()).filter(Boolean),
        link: document.getElementById('f-link').value.trim(),
        pitchNote: document.getElementById('f-pitch-note').value.trim(),
        status: targetStatus,
        editorId: session.id,
        category: session.category,
        date: new Date().toISOString().slice(0,10),
      };

      if (!data.title) { alert('제목을 입력해주세요.'); return; }

      if (id) {
        await Store.Posts.update(id, data);
      } else {
        await Store.Posts.create(data);
      }

      closeDrawer();
      await loadPosts();
    }

    async function pitchPost(id) {
      await Store.Posts.pitch(id);
      await loadPosts();
    }

    async function cancelPitch(id) {
      await Store.Posts.update(id, { status: 'draft' });
      await loadPosts();
    }

    async function deletePost(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      await Store.Posts.delete(id);
      await loadPosts();
    }

    function logout() {
      Store.Auth.logout();
      window.location.href = 'login.html';
    }

    init();
  </script>
</body>
</html>
