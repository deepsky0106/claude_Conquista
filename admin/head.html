<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Head Editor — DOGWALKPOOPOO Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .admin-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    .admin-sidebar {
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      padding: 2rem 0;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 220px;
      display: flex;
      flex-direction: column;
    }

    .sidebar-logo {
      padding: 1rem 1.5rem 2rem;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .sidebar-logo span { color: var(--accent); }

    .sidebar-section {
      padding: 0.5rem 1.5rem;
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 1rem;
      margin-bottom: 0.25rem;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.5rem;
      font-size: 0.82rem;
      color: var(--text-secondary);
      cursor: pointer;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      text-decoration: none;
      transition: color 0.2s, background 0.2s;
    }
    .sidebar-link:hover { color: var(--text-primary); background: var(--bg-3); }
    .sidebar-link.active { color: var(--accent); }

    .sidebar-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

    .sidebar-footer {
      margin-top: auto;
      padding: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .user-badge { font-size: 0.72rem; color: var(--text-secondary); margin-bottom: 0.75rem; }
    .user-role {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 0.25rem;
    }

    .logout-btn {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .logout-btn:hover { color: var(--text-secondary); }

    /* MAIN */
    .admin-main { margin-left: 220px; padding: 2.5rem; }

    .admin-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .admin-title { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 400; }

    /* STATS ROW */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-2);
      padding: 1.25rem 1.5rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .stat-card:hover, .stat-card.active { background: var(--bg-3); }
    .stat-card.active { border-bottom: 2px solid var(--accent); }

    .stat-number {
      font-size: 2rem;
      font-weight: 200;
      letter-spacing: -0.02em;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 0.3rem;
    }
    .stat-label {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    /* PITCHED QUEUE */
    .pitched-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      margin-bottom: 1px;
      transition: border-color 0.2s;
    }
    .pitched-card:hover { border-color: var(--accent-dim); }

    .pitched-header {
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.5rem;
      align-items: start;
      cursor: pointer;
    }

    .pitched-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 0.3rem;
    }
    .pitched-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .pitched-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .pitched-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

    .btn {
      padding: 0.6rem 1.25rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background 0.2s, color 0.2s;
      border: 1px solid;
      background: transparent;
      white-space: nowrap;
    }

    .btn-approve { border-color: var(--accent); color: var(--accent); }
    .btn-approve:hover { background: var(--accent); color: var(--bg); }
    .btn-revise  { border-color: #7A6A3A; color: #B8874A; }
    .btn-revise:hover { background: #7A6A3A; color: var(--text-primary); }
    .btn-reject  { border-color: #7A3030; color: #C07070; }
    .btn-reject:hover { background: #7A3030; color: var(--text-primary); }
    .btn-ghost { border-color: var(--border); color: var(--text-secondary); }
    .btn-ghost:hover { border-color: var(--text-secondary); color: var(--text-primary); background: transparent; }

    /* NOTE FORM */
    .note-form {
      padding: 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--bg-3);
    }

    .note-label {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    textarea {
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.75rem;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      line-height: 1.6;
      outline: none;
      resize: vertical;
      min-height: 80px;
      margin-bottom: 0.75rem;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--accent-dim); }
    textarea::placeholder { color: var(--text-muted); }

    .note-actions { display: flex; gap: 0.5rem; }

    /* PITCH NOTE */
    .pitch-note {
      margin-top: 0.75rem;
      padding: 0.6rem 0.8rem;
      background: var(--bg-3);
      border-left: 2px solid var(--accent-dim);
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* STATUS BADGE */
    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid;
    }
    .status-draft     { color: var(--text-muted);  border-color: var(--border); }
    .status-pitched   { color: #8A9A6A;             border-color: #4A5A3A; }
    .status-revision  { color: #B8874A;             border-color: #7A5030; }
    .status-published { color: var(--accent);       border-color: var(--accent-dim); }
    .status-rejected  { color: #C07070;             border-color: #7A3030; }

    /* EMPTY */
    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
    }
    .empty-state-title {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }
    .empty-state-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.7; }

    /* CATEGORY TAG */
    .cat-tag {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border: 1px solid var(--border);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-right: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="sidebar-logo">
        <a href="../index.html" style="text-decoration:none;color:inherit;">UN<span>LIT</span></a>
      </div>

      <div class="sidebar-section">Queue</div>
      <button class="sidebar-link active" onclick="filterView('pitched')">
        <span class="sidebar-dot" style="background:#8A9A6A"></span>
        검토 대기 <span id="sb-pitched-count" style="font-size:0.65rem;color:var(--accent);margin-left:auto"></span>
      </button>

      <div class="sidebar-section">Archive</div>
      <button class="sidebar-link" onclick="filterView('all')">
        <span class="sidebar-dot" style="background:var(--text-muted)"></span>
        전체 포스트
      </button>
      <button class="sidebar-link" onclick="filterView('published')">
        <span class="sidebar-dot" style="background:var(--accent-dim)"></span>
        발행됨
      </button>
      <button class="sidebar-link" onclick="filterView('rejected')">
        <span class="sidebar-dot" style="background:#7A3030"></span>
        반려됨
      </button>

      <div class="sidebar-section">Site</div>
      <a class="sidebar-link" href="../index.html" target="_blank">공개 사이트 ↗</a>
      <a class="sidebar-link" href="../team.html" target="_blank">팀 페이지 ↗</a>

      <div class="sidebar-footer">
        <div class="user-badge">
          <span class="user-role">편집장</span>
          <span id="sidebar-name">—</span>
        </div>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1 class="admin-title serif" id="view-title">검토 대기</h1>
          <p style="font-size:0.75rem;color:var(--text-secondary);margin-top:0.3rem" id="view-desc">
            에디터가 검토를 요청한 포스트들입니다.
          </p>
        </div>
      </div>

      <!-- STATS -->
      <div class="stats-row" id="stats-row">
        <div class="stat-card active" onclick="filterView('pitched'); highlightStat(this)">
          <div class="stat-number" id="stat-pitched">0</div>
          <div class="stat-label">검토 대기</div>
        </div>
        <div class="stat-card" onclick="filterView('published'); highlightStat(this)">
          <div class="stat-number" id="stat-published">0</div>
          <div class="stat-label">발행됨</div>
        </div>
        <div class="stat-card" onclick="filterView('revision'); highlightStat(this)">
          <div class="stat-number" id="stat-revision">0</div>
          <div class="stat-label">수정 요청</div>
        </div>
        <div class="stat-card" onclick="filterView('draft'); highlightStat(this)">
          <div class="stat-number" id="stat-draft">0</div>
          <div class="stat-label">초안</div>
        </div>
        <div class="stat-card" onclick="filterView('all'); highlightStat(this)">
          <div class="stat-number" id="stat-all">0</div>
          <div class="stat-label">전체</div>
        </div>
      </div>

      <!-- POSTS LIST -->
      <div id="posts-container"></div>
    </main>
  </div>

  <script src="../js/store.js"></script>
  <script>
    let session = null;
    let allPosts = [];
    let currentFilter = 'pitched';
    let openNoteId = null;

    const VIEW_CONFIG = {
      all:       { title: '전체 포스트',      desc: '모든 포스트' },
      pitched:   { title: '검토 대기',         desc: '에디터가 검토를 요청한 포스트들입니다.' },
      published: { title: '발행됨',            desc: '공개 사이트에 발행된 포스트들입니다.' },
      revision:  { title: '수정 요청됨',       desc: '에디터에게 수정을 요청한 포스트들입니다.' },
      draft:     { title: '초안',              desc: '에디터가 작성 중인 포스트들입니다.' },
      rejected:  { title: '반려됨',            desc: '반려된 포스트들입니다.' },
    };

    const CAT_LABELS = {
      film: 'Film', 'contemporary-art': 'Art', architecture: 'Arch',
      object: 'Object', nature: 'Nature', sound: 'Sound',
    };

    async function init() {
      session = Store.Auth.requireSession('login.html');
      if (!session) return;
      if (session.role !== 'head') {
        window.location.href = 'editor.html';
        return;
      }

      document.getElementById('sidebar-name').textContent = session.name;
      await loadPosts();
    }

    async function loadPosts() {
      allPosts = await Store.Posts.getAll();
      updateStats();
      renderPosts();
    }

    function updateStats() {
      const counts = { all: allPosts.length, pitched: 0, published: 0, revision: 0, draft: 0, rejected: 0 };
      allPosts.forEach(p => { if (counts[p.status] !== undefined) counts[p.status]++; });
      Object.keys(counts).forEach(k => {
        const el = document.getElementById(`stat-${k}`);
        if (el) el.textContent = counts[k];
      });
      const sbEl = document.getElementById('sb-pitched-count');
      if (sbEl) sbEl.textContent = counts.pitched > 0 ? counts.pitched : '';
    }

    function filterView(filter) {
      currentFilter = filter;
      openNoteId = null;
      const cfg = VIEW_CONFIG[filter] || VIEW_CONFIG.all;
      document.getElementById('view-title').textContent = cfg.title;
      document.getElementById('view-desc').textContent = cfg.desc;

      // Sidebar active state
      document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
      renderPosts();
    }

    function highlightStat(el) {
      document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
    }

    function renderPosts() {
      const container = document.getElementById('posts-container');
      const filtered = currentFilter === 'all'
        ? allPosts
        : allPosts.filter(p => p.status === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-title">없습니다</div>
            <p class="empty-state-desc">이 상태의 포스트가 없습니다.</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(p => buildCard(p)).join('');
    }

    function buildCard(p) {
      const catLabel = CAT_LABELS[p.category] || p.category || '';
      const pitchNoteHtml = p.pitchNote
        ? `<div class="pitch-note">에디터 노트: "${p.pitchNote}"</div>`
        : '';
      const noteFormHtml = openNoteId === p.id ? buildNoteForm(p) : '';
      const actions = buildActions(p);

      return `
        <div class="pitched-card" id="card-${p.id}">
          <div class="pitched-header">
            <div>
              <span class="cat-tag">${catLabel}</span>
              <span class="status-badge status-${p.status}">${statusLabel(p.status)}</span>
              <div class="pitched-title" style="margin-top:0.75rem">${p.title || '(제목 없음)'}</div>
              <div class="pitched-meta">${p.source || ''} &middot; ${formatDate(p.createdAt)}</div>
              <div class="pitched-desc">${p.description || ''}</div>
              ${pitchNoteHtml}
            </div>
            <div class="pitched-actions">${actions}</div>
          </div>
          ${noteFormHtml}
        </div>`;
    }

    function buildActions(p) {
      if (p.status === 'pitched') {
        return `
          <button class="btn btn-approve" onclick="quickApprove('${p.id}')">발행 ✓</button>
          <button class="btn btn-revise" onclick="toggleNote('${p.id}', 'revise')">수정 요청</button>
          <button class="btn btn-reject" onclick="toggleNote('${p.id}', 'reject')">반려</button>`;
      }
      if (p.status === 'published') {
        return `<button class="btn btn-ghost" onclick="toggleNote('${p.id}', 'unpublish')">발행 취소</button>`;
      }
      return '';
    }

    function buildNoteForm(p) {
      return `
        <div class="note-form" id="note-form-${p.id}">
          <div class="note-label">헤드 에디터 노트 (에디터에게 전달됩니다)</div>
          <textarea id="note-text-${p.id}" placeholder="수정 방향이나 반려 이유를 적어주세요."></textarea>
          <div class="note-actions">
            <button class="btn btn-revise" onclick="submitRevise('${p.id}')">수정 요청 전송</button>
            <button class="btn btn-reject" onclick="submitReject('${p.id}')">반려</button>
            <button class="btn btn-ghost" onclick="closeNote()">취소</button>
          </div>
        </div>`;
    }

    function toggleNote(id, action) {
      if (openNoteId === id) {
        openNoteId = null;
      } else {
        openNoteId = id;
      }
      renderPosts();
      if (openNoteId) {
        document.getElementById(`note-text-${id}`)?.focus();
      }
    }

    function closeNote() {
      openNoteId = null;
      renderPosts();
    }

    async function quickApprove(id) {
      await Store.Posts.approve(id, '');
      await loadPosts();
    }

    async function submitRevise(id) {
      const note = document.getElementById(`note-text-${id}`)?.value.trim() || '';
      await Store.Posts.revise(id, note);
      openNoteId = null;
      await loadPosts();
    }

    async function submitReject(id) {
      const note = document.getElementById(`note-text-${id}`)?.value.trim() || '';
      await Store.Posts.reject(id, note);
      openNoteId = null;
      await loadPosts();
    }

    function statusLabel(s) {
      return { draft:'초안', pitched:'검토 대기', revision:'수정 요청', published:'발행됨', rejected:'반려됨' }[s] || s;
    }

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('ko-KR', { month:'short', day:'numeric' });
    }

    function logout() {
      Store.Auth.logout();
      window.location.href = 'login.html';
    }

    init();
  </script>
</body>
</html>
